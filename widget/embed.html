<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga – Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%; width: 100%;
            font-family: Arial, sans-serif;
            background: transparent;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: #fff;
            position: relative;
        }

        #messages-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        #empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #empty-state img {
            max-width: 80%;
            max-height: 70%;
            object-fit: contain;
        }
        #messages-area.has-messages #empty-state { display: none; }

        .message { margin-bottom: 20px; padding: 15px; border-radius: 15px; max-width: 85%; line-height: 1.6; position: relative; }
        .user-msg { background-color: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .bot-msg { background-color: #e4e6eb; color: black; align-self: flex-start; }

        .bot-msg h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem 0; color: #007bff; border-bottom: 1px solid #e4e6eb; padding-bottom: 4px; }
        .bot-msg h2 { font-size: 1.1rem; margin-top: 1rem; }
        .bot-msg ul, .bot-msg ol { padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .bot-msg li { margin-bottom: 0.75rem; }
        .bot-msg p { margin-bottom: 1.25rem; line-height: 1.6; }
        .bot-msg a { text-decoration: underline; text-decoration-skip-ink: auto; }

        .msg-toolbar {
            display: flex; gap: 10px;
            margin-top: 10px; padding-top: 10px; border-top: 1px solid #ccc;
        }

        .tool-btn {
            background-color: #ffffff; border: 1px solid #adb5bd; color: #495057;
            cursor: pointer; padding: 5px 10px; border-radius: 15px;
            font-size: 11px; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
            transition: all 0.2s ease;
        }
        .tool-btn:hover { background-color: #f0f0f0; }

        .suggestions-container {
            display: flex; flex-wrap: wrap; gap: 8px;
            justify-content: center; margin-bottom: 15px; margin-top: 5px; width: 100%;
        }

        .suggestion-btn {
            background-color: white; border: 1px solid #007bff; color: #007bff;
            padding: 8px 12px; border-radius: 20px; font-size: 14px;
            cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .suggestion-btn:hover { background-color: #007bff; color: #fff; }

        .controls-area {
            display: flex; flex-direction: column; gap: 8px;
            padding: 12px 16px; border-top: 1px solid #e0e0e0;
            background: #fff; flex-shrink: 0;
        }

        .controls-row {
            display: flex; gap: 8px; align-items: center;
        }

        input[type="text"] {
            flex: 1; min-width: 0; padding: 10px 14px; border-radius: 8px;
            border: 2px solid #1d2a5e; font-size: 16px; outline: none;
            font-family: "Comic Sans MS", "Segoe Print", cursive;
            color: #222;
            background: #fff;
        }
        input[type="text"]::placeholder { color: #222; font-style: italic; opacity: 0.85; }
        input[type="text"]:focus { border-color: #1d2a5e; box-shadow: 0 0 0 2px rgba(29,42,94,0.15); }

        .img-btn {
            border: none;
            background-color: transparent;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: pointer;
            padding: 0;
            font-size: 0;
            color: transparent;
            transition: transform 0.15s, opacity 0.2s;
        }
        .img-btn:hover:not(:disabled) { transform: translateY(-1px); }
        .img-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #sendBtn {
            background-image: url("/widget/assets/btn-send.png");
            width: 110px; height: 45px;
            flex-shrink: 0;
        }

        #ttsBtn {
            flex: 1; height: 45px;
            background-color: #1d2a5e;
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: "Comic Sans MS", "Segoe Print", cursive;
            font-size: 15px; font-weight: bold; color: #fff;
        }
        #ttsBtn:hover:not(:disabled) { background-color: #26377a; }
        #ttsBtn svg { flex-shrink: 0; }

        #newChatBtn {
            background-image: url("/widget/assets/btn-new-chat.png");
            flex: 1; height: 45px;
        }

        #progress-indicator {
            padding: 10px; background-color: white; border-top: 1px solid #eee;
            display: none; color: #333; font-weight: bold; text-align: center;
            flex-shrink: 0;
        }

        .contact-source {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            vertical-align: middle;
        }

        .contact-source-photo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages-area">
            <div id="messages"></div>
            <div id="empty-state"><img src="/widget/assets/empty-state.png" alt="Zeptej se mě"></div>
        </div>
        <div id="progress-indicator">Pracuji...</div>
        <div class="controls-area">
            <div class="controls-row">
                <input type="text" id="query" placeholder="Zadej dotaz..." onkeydown="if(event.key === 'Enter') ask()">
                <button id="sendBtn" class="img-btn" onclick="ask()" aria-label="Odeslat">Odeslat</button>
            </div>
            <div class="controls-row">
                <button id="newChatBtn" class="img-btn" onclick="startNewChat()" aria-label="Nový chat">Nový chat</button>
                <button id="ttsBtn" class="img-btn" onclick="playLastMessage()" title="Přečíst poslední odpověď" aria-label="Přečti odpověď"><svg id="ttsBtnIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#fff" stroke="none"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>Přečti odpověď</button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true });

        function openLinksInNewTab(el) {
            el.querySelectorAll('a[href]').forEach(a => {
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
            });
        }

        /* API base – same origin when served from Railway */
        const API_BASE = location.origin;

        let chatHistory = [];
        const progressIndicator = document.getElementById('progress-indicator');

        /* Session Persistence */
        window.onload = () => {
            const navEntries = performance.getEntriesByType("navigation");
            if (navEntries.length > 0 && navEntries[0].type === "reload") {
                sessionStorage.removeItem("chatHistory");
                chatHistory = [];
            } else {
                const saved = sessionStorage.getItem("chatHistory");
                if (saved) {
                    chatHistory = JSON.parse(saved);
                    restoreChat();
                }
            }
        };

        function startNewChat() {
            sessionStorage.removeItem("chatHistory");
            chatHistory = [];
            document.getElementById('messages').innerHTML = '';
            document.getElementById('messages-area').classList.remove('has-messages');
        }

        function restoreChat() {
            const msgs = document.getElementById('messages');
            msgs.innerHTML = '';
            if (chatHistory.length > 0) {
                document.getElementById('messages-area').classList.add('has-messages');
            }
            chatHistory.forEach(msg => {
                const newMsg = document.createElement('div');
                newMsg.classList.add('message', msg.role === 'user' ? 'user-msg' : 'bot-msg');
                let content = msg.content;
                if (msg.role === 'assistant') content = normalizeAnswer(content);
                newMsg.innerHTML = marked.parse(content);
                openLinksInNewTab(newMsg);
                if (msg.role === 'assistant') addToolbar(newMsg, content);
                msgs.appendChild(newMsg);
            });
            if (msgs.lastChild) msgs.lastChild.scrollIntoView();
        }

        function downloadFile(filename, text, mime) {
            mime = mime || 'text/plain';
            const element = document.createElement('a');
            element.setAttribute('href', `data:${mime};charset=utf-8,` + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        // Exports render through marked.parse (same as the on-screen chat) so
        // contact photos show up as actual images, not raw markdown/HTML text —
        // a plain .txt file can't display an <img>.
        function buildExportHtml(title, bodyHtml) {
            return `<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>
    body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.5; max-width: 700px; margin: 0 auto; padding: 16px; color: #222; }
    img { max-width: 100%; }
    .contact-source { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
    .contact-source-photo { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .msg-block { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #ddd; }
    .msg-role { font-weight: bold; text-transform: uppercase; font-size: 12px; color: #666; margin-bottom: 4px; }
</style>
</head>
<body>${bodyHtml}</body>
</html>`;
        }

        function downloadHistory() {
            if (chatHistory.length === 0) return;
            const body = chatHistory.map(msg => {
                const rendered = msg.role === 'assistant' ? marked.parse(normalizeAnswer(msg.content)) : marked.parse(msg.content);
                return `<div class="msg-block"><div class="msg-role">${msg.role}</div>${rendered}</div>`;
            }).join('\n');
            downloadFile('chat_historie.html', buildExportHtml('Chat historie', body), 'text/html');
        }

        function normalizeAnswer(md, sources) {
            if (!md) return md;
            md = md.replace(/^[•*-]\s*(https?:\/\/\S+)/gm, (match, url) => {
                const filename = url.split('/').pop();
                const title = filename
                    .replace(/\.(pdf|docx?|xlsx?|txt)$/i, '')
                    .replace(/[_-]+/g, ' ')
                    .replace(/^(\w)/, (m) => m.toUpperCase())
                    .trim();
                return `- [${title}](${url})`;
            });
            return md.trim();
        }

        async function playLastMessage() {
            const btn = document.getElementById('ttsBtn');
            if (btn.disabled) return;

            const assistantMsgs = chatHistory.filter(m => m.role === 'assistant');
            if (assistantMsgs.length === 0) return;

            const lastMsgContent = assistantMsgs[assistantMsgs.length - 1].content;

            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳';
            btn.disabled = true;

            try {
                const res = await fetch(API_BASE + '/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: lastMsgContent })
                });

                if (!res.ok) throw new Error('TTS Failed');

                const blob = await res.blob();
                const audio = new Audio(URL.createObjectURL(blob));

                btn.innerHTML = '🔊';
                audio.play();

                audio.onended = () => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                };

                audio.onerror = () => {
                    throw new Error("Playback error");
                };

            } catch (e) {
                console.error(e);
                btn.innerHTML = '❌';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 2000);
            }
        }

        function addToolbar(msgElement, content) {
            const toolbar = document.createElement('div');
            toolbar.className = 'msg-toolbar';

            const dlReplyBtn = document.createElement('button');
            dlReplyBtn.className = 'tool-btn';
            dlReplyBtn.innerHTML = '💾 Odpověď';
            dlReplyBtn.onclick = () => downloadFile('odpoved.html', buildExportHtml('Odpověď', marked.parse(content)), 'text/html');

            const dlChatBtn = document.createElement('button');
            dlChatBtn.className = 'tool-btn';
            dlChatBtn.innerHTML = '📂 Celý chat';
            dlChatBtn.onclick = () => downloadHistory();

            toolbar.appendChild(dlReplyBtn);
            toolbar.appendChild(dlChatBtn);
            msgElement.appendChild(toolbar);
        }

        function addMessage(role, content, sources) {
            const msgs = document.getElementById('messages');
            document.getElementById('messages-area').classList.add('has-messages');
            const newMsg = document.createElement('div');
            newMsg.classList.add('message', role === 'user' ? 'user-msg' : 'bot-msg');

            if (role === 'assistant') content = normalizeAnswer(content, sources);
            newMsg.innerHTML = marked.parse(content);
            openLinksInNewTab(newMsg);
            if (role === 'assistant') addToolbar(newMsg, content);

            msgs.appendChild(newMsg);
            if (role === 'user') newMsg.scrollIntoView({ behavior: 'smooth', block: 'end' });
            return newMsg;
        }

        function addSuggestions(suggestions) {
            if (!suggestions || suggestions.length === 0) return;
            const msgs = document.getElementById('messages');
            const container = document.createElement('div');
            container.className = 'suggestions-container';
            suggestions.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.textContent = text;
                btn.onclick = () => ask(text);
                container.appendChild(btn);
            });
            msgs.appendChild(container);
        }

        async function ask(suggestionText = null) {
            const input = document.getElementById('query');
            const btn = document.getElementById('sendBtn');
            const query = suggestionText || input.value.trim();
            if (!query) return;

            addMessage('user', query);
            input.value = '';
            btn.disabled = true;
            chatHistory.push({ role: "user", content: query });

            sessionStorage.setItem("chatHistory", JSON.stringify(chatHistory));

            const oldSuggestions = document.querySelectorAll('.suggestions-container');
            oldSuggestions.forEach(el => el.style.display = 'none');
            progressIndicator.style.display = 'block';

            try {
                const response = await fetch(API_BASE + '/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        history: chatHistory
                    })
                });

                const data = await response.json();
                progressIndicator.style.display = 'none';
                const sources = data.metadata && data.metadata.sources ? data.metadata.sources : [];
                const answerElement = addMessage('assistant', data.answer, sources);

                chatHistory.push({ role: "assistant", content: data.answer });
                sessionStorage.setItem("chatHistory", JSON.stringify(chatHistory));

                if (data.suggestions) addSuggestions(data.suggestions);
                setTimeout(() => { answerElement.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
            } catch (error) {
                progressIndicator.style.display = 'none';
                console.error('Chat error:', error);
                addMessage('assistant', 'Omlouváme se, nepodařilo se spojit se serverem. Zkuste to prosím znovu.');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
