<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga – Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%; width: 100%;
            font-family: Arial, sans-serif;
            background: transparent;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: #fff;
            position: relative;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        .message { margin-bottom: 20px; padding: 15px; border-radius: 15px; max-width: 85%; line-height: 1.6; position: relative; }
        .user-msg { background-color: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .bot-msg { background-color: #e4e6eb; color: black; align-self: flex-start; }

        .bot-msg h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem 0; color: #007bff; border-bottom: 1px solid #e4e6eb; padding-bottom: 4px; }
        .bot-msg h2 { font-size: 1.1rem; margin-top: 1rem; }
        .bot-msg ul, .bot-msg ol { padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .bot-msg li { margin-bottom: 0.75rem; }
        .bot-msg p { margin-bottom: 1.25rem; line-height: 1.6; }
        .bot-msg a { text-decoration: underline; text-decoration-skip-ink: auto; }

        .msg-toolbar {
            display: flex; gap: 10px;
            margin-top: 10px; padding-top: 10px; border-top: 1px solid #ccc;
        }

        .tool-btn {
            background-color: #ffffff; border: 1px solid #adb5bd; color: #495057;
            cursor: pointer; padding: 5px 10px; border-radius: 15px;
            font-size: 11px; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
            transition: all 0.2s ease;
        }
        .tool-btn:hover { background-color: #f0f0f0; }

        .suggestions-container {
            display: flex; flex-wrap: wrap; gap: 8px;
            justify-content: center; margin-bottom: 15px; margin-top: 5px; width: 100%;
        }

        .suggestion-btn {
            background-color: white; border: 1px solid #007bff; color: #007bff;
            padding: 8px 12px; border-radius: 20px; font-size: 14px;
            cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        .suggestion-btn:hover { background-color: #007bff; color: #fff; }

        .controls-area {
            display: flex; flex-direction: column; gap: 8px;
            padding: 12px 16px; border-top: 1px solid #e0e0e0;
            background: #fff; flex-shrink: 0;
        }

        .controls-row {
            display: flex; gap: 8px; align-items: center;
        }

        input[type="text"] {
            width: 100%; padding: 12px; border-radius: 5px;
            border: 1px solid #ccc; font-size: 16px; outline: none;
        }
        input[type="text"]:focus { border-color: #007bff; }

        #sendBtn {
            width: 100%; padding: 12px 25px; border: none; border-radius: 5px;
            background-color: #28a745; color: white; cursor: pointer;
            font-size: 16px; font-weight: bold; transition: background-color 0.3s;
            white-space: nowrap;
        }
        #sendBtn:disabled { background-color: #6c757d; cursor: not-allowed; }
        #sendBtn:hover:not(:disabled) { background-color: #218838; }

        #ttsBtn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #17a2b8;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #ttsBtn:disabled { background-color: #6c757d; cursor: not-allowed; }

        #newChatBtn {
            flex: 1;
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        #progress-indicator {
            padding: 10px; background-color: white; border-top: 1px solid #eee;
            display: none; color: #333; font-weight: bold; text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <div id="progress-indicator">Pracuji...</div>
        <div class="controls-area">
            <input type="text" id="query" placeholder="Zadejte dotaz..." onkeydown="if(event.key === 'Enter') ask()">
            <button id="sendBtn" onclick="ask()">Odeslat</button>
            <div class="controls-row">
                <button id="newChatBtn" onclick="startNewChat()">Nový chat</button>
                <button id="ttsBtn" onclick="playLastMessage()" title="Přečíst poslední odpověď">🔊 Přečíst</button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true });

        /* API base – same origin when served from Railway */
        const API_BASE = location.origin;

        let chatHistory = [];
        const progressIndicator = document.getElementById('progress-indicator');

        /* Session Persistence */
        window.onload = () => {
            const navEntries = performance.getEntriesByType("navigation");
            if (navEntries.length > 0 && navEntries[0].type === "reload") {
                sessionStorage.removeItem("chatHistory");
                chatHistory = [];
            } else {
                const saved = sessionStorage.getItem("chatHistory");
                if (saved) {
                    chatHistory = JSON.parse(saved);
                    restoreChat();
                }
            }
        };

        function startNewChat() {
            sessionStorage.removeItem("chatHistory");
            chatHistory = [];
            document.getElementById('messages').innerHTML = '';
        }

        function restoreChat() {
            const msgs = document.getElementById('messages');
            msgs.innerHTML = '';
            chatHistory.forEach(msg => {
                const newMsg = document.createElement('div');
                newMsg.classList.add('message', msg.role === 'user' ? 'user-msg' : 'bot-msg');
                let content = msg.content;
                if (msg.role === 'assistant') content = normalizeAnswer(content);
                newMsg.innerHTML = marked.parse(content);
                if (msg.role === 'assistant') addToolbar(newMsg, content);
                msgs.appendChild(newMsg);
            });
            if (msgs.lastChild) msgs.lastChild.scrollIntoView();
        }

        function downloadFile(filename, text) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        function downloadHistory() {
            if (chatHistory.length === 0) return;
            const text = chatHistory.map(msg => `[${msg.role.toUpperCase()}]\n${msg.content}\n-------------------`).join('\n\n');
            downloadFile('chat_historie.txt', text);
        }

        function normalizeAnswer(md, sources) {
            if (!md) return md;
            md = md.replace(/^[•*-]\s*(https?:\/\/\S+)/gm, (match, url) => {
                const filename = url.split('/').pop();
                const title = filename
                    .replace(/\.(pdf|docx?|xlsx?|txt)$/i, '')
                    .replace(/[_-]+/g, ' ')
                    .replace(/^(\w)/, (m) => m.toUpperCase())
                    .trim();
                return `- [${title}](${url})`;
            });
            return md.trim();
        }

        async function playLastMessage() {
            const btn = document.getElementById('ttsBtn');
            if (btn.disabled) return;

            const assistantMsgs = chatHistory.filter(m => m.role === 'assistant');
            if (assistantMsgs.length === 0) return;

            const lastMsgContent = assistantMsgs[assistantMsgs.length - 1].content;

            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳';
            btn.disabled = true;

            try {
                const res = await fetch(API_BASE + '/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: lastMsgContent })
                });

                if (!res.ok) throw new Error('TTS Failed');

                const blob = await res.blob();
                const audio = new Audio(URL.createObjectURL(blob));

                btn.innerHTML = '🔊';
                audio.play();

                audio.onended = () => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                };

                audio.onerror = () => {
                    throw new Error("Playback error");
                };

            } catch (e) {
                console.error(e);
                btn.innerHTML = '❌';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 2000);
            }
        }

        function addToolbar(msgElement, content) {
            const toolbar = document.createElement('div');
            toolbar.className = 'msg-toolbar';

            const dlReplyBtn = document.createElement('button');
            dlReplyBtn.className = 'tool-btn';
            dlReplyBtn.innerHTML = '💾 Odpověď';
            dlReplyBtn.onclick = () => downloadFile('odpoved.txt', content);

            const dlChatBtn = document.createElement('button');
            dlChatBtn.className = 'tool-btn';
            dlChatBtn.innerHTML = '📂 Celý chat';
            dlChatBtn.onclick = () => downloadHistory();

            toolbar.appendChild(dlReplyBtn);
            toolbar.appendChild(dlChatBtn);
            msgElement.appendChild(toolbar);
        }

        function addMessage(role, content, sources) {
            const msgs = document.getElementById('messages');
            const newMsg = document.createElement('div');
            newMsg.classList.add('message', role === 'user' ? 'user-msg' : 'bot-msg');

            if (role === 'assistant') content = normalizeAnswer(content, sources);
            newMsg.innerHTML = marked.parse(content);
            if (role === 'assistant') addToolbar(newMsg, content);

            msgs.appendChild(newMsg);
            if (role === 'user') newMsg.scrollIntoView({ behavior: 'smooth', block: 'end' });
            return newMsg;
        }

        function addSuggestions(suggestions) {
            if (!suggestions || suggestions.length === 0) return;
            const msgs = document.getElementById('messages');
            const container = document.createElement('div');
            container.className = 'suggestions-container';
            suggestions.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-btn';
                btn.textContent = text;
                btn.onclick = () => ask(text);
                container.appendChild(btn);
            });
            msgs.appendChild(container);
        }

        async function ask(suggestionText = null) {
            const input = document.getElementById('query');
            const btn = document.getElementById('sendBtn');
            const query = suggestionText || input.value.trim();
            if (!query) return;

            addMessage('user', query);
            input.value = '';
            btn.disabled = true;
            chatHistory.push({ role: "user", content: query });

            sessionStorage.setItem("chatHistory", JSON.stringify(chatHistory));

            const oldSuggestions = document.querySelectorAll('.suggestions-container');
            oldSuggestions.forEach(el => el.style.display = 'none');
            progressIndicator.style.display = 'block';

            try {
                const response = await fetch(API_BASE + '/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: "Odpovídej pouze v češtině. Dotaz: " + query,
                        history: chatHistory
                    })
                });

                const data = await response.json();
                progressIndicator.style.display = 'none';
                const sources = data.metadata && data.metadata.sources ? data.metadata.sources : [];
                const answerElement = addMessage('assistant', data.answer, sources);

                chatHistory.push({ role: "assistant", content: data.answer });
                sessionStorage.setItem("chatHistory", JSON.stringify(chatHistory));

                if (data.suggestions) addSuggestions(data.suggestions);
                setTimeout(() => { answerElement.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
            } catch (error) {
                progressIndicator.style.display = 'none';
                console.error('Chat error:', error);
                addMessage('assistant', 'Omlouváme se, nepodařilo se spojit se serverem. Zkuste to prosím znovu.');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
