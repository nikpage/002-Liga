<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – znalostní báze</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
header { background: #1a1a2e; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
header h1 { font-size: 1.1rem; font-weight: 600; }
.badge { background: #e63946; color: #fff; border-radius: 4px; padding: 2px 8px; font-size: .75rem; }
.container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
.toolbar { display: flex; gap: .75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.toolbar input[type=text] { flex: 1; min-width: 200px; padding: .5rem .75rem; border: 1px solid #ccc; border-radius: 6px; font-size: .95rem; }
button { padding: .5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; font-weight: 500; }
.btn-primary { background: #1a1a2e; color: #fff; }
.btn-primary:hover { background: #2d2d50; }
.btn-danger { background: #e63946; color: #fff; }
.btn-danger:hover { background: #c1121f; }
.btn-ghost { background: transparent; color: #555; border: 1px solid #ccc; }
.btn-ghost:hover { background: #eee; }
.btn-sm { padding: .3rem .65rem; font-size: .8rem; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
th { background: #f0f0f0; padding: .65rem 1rem; text-align: left; font-size: .82rem; color: #555; text-transform: uppercase; letter-spacing: .04em; }
td { padding: .65rem 1rem; border-top: 1px solid #eee; font-size: .88rem; vertical-align: top; }
td.content-cell { max-width: 420px; }
.content-preview { white-space: pre-wrap; word-break: break-word; max-height: 80px; overflow: hidden; cursor: pointer; color: #333; }
.content-preview.expanded { max-height: none; }
.meta { color: #888; font-size: .78rem; margin-top: .25rem; }
.audience-tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: .75rem; font-weight: 600; }
.tag-public { background: #d0f0c0; color: #1a5c00; }
.tag-poradna { background: #cce0ff; color: #003399; }
.tag-other { background: #eee; color: #555; }
.actions { display: flex; gap: .4rem; white-space: nowrap; }
.pagination { display: flex; gap: .5rem; align-items: center; margin-top: 1rem; justify-content: center; }
.total-label { margin-left: auto; color: #888; font-size: .85rem; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.modal { background: #fff; border-radius: 10px; padding: 1.5rem; width: min(680px, 95vw); max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
.modal h2 { font-size: 1.1rem; margin-bottom: 1rem; }
.form-group { margin-bottom: .9rem; }
label { display: block; font-size: .82rem; font-weight: 600; color: #555; margin-bottom: .3rem; }
input[type=text], input[type=date], textarea, select { width: 100%; padding: .5rem .75rem; border: 1px solid #ccc; border-radius: 6px; font-size: .92rem; font-family: inherit; }
textarea { min-height: 140px; resize: vertical; }
.modal-footer { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.2rem; }
.error-msg { color: #e63946; font-size: .85rem; margin-top: .5rem; }
.history-list { margin-top: .75rem; }
.history-item { background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; padding: .75rem 1rem; margin-bottom: .6rem; }
.history-item .h-meta { display: flex; align-items: center; gap: .75rem; margin-bottom: .5rem; }
.history-item .h-action { font-weight: 700; font-size: .8rem; text-transform: uppercase; }
.action-edit { color: #0077cc; }
.action-delete { color: #e63946; }
.history-item .h-content { font-size: .85rem; color: #444; white-space: pre-wrap; max-height: 60px; overflow: hidden; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ccc; border-top-color: #1a1a2e; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #222; color: #fff; padding: .7rem 1.2rem; border-radius: 8px; font-size: .9rem; opacity: 0; transition: opacity .3s; z-index: 200; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
    <h1>Znalostní báze – správa záznamů</h1>
    <span class="badge">Admin</span>
</header>

<div class="container">
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Hledat v obsahu…" />
        <button class="btn-ghost" onclick="loadChunks()">Hledat</button>
        <button class="btn-primary" onclick="openCreate()">+ Nový záznam</button>
        <span class="total-label" id="totalLabel"></span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Obsah</th>
                <th>Zdroj / nadpis</th>
                <th>Audience</th>
                <th>Přidáno</th>
                <th>Akce</th>
            </tr>
        </thead>
        <tbody id="chunksTable">
            <tr><td colspan="5" style="text-align:center;padding:2rem;color:#aaa"><span class="spinner"></span></td></tr>
        </tbody>
    </table>

    <div class="pagination" id="pagination"></div>
</div>

<!-- Edit / Create Modal -->
<div class="overlay" id="editOverlay">
    <div class="modal">
        <h2 id="modalTitle">Nový záznam</h2>
        <div class="form-group">
            <label>Obsah *</label>
            <textarea id="fContent" placeholder="Text záznamu…"></textarea>
        </div>
        <div class="form-group">
            <label>Nadpis dokumentu</label>
            <input type="text" id="fTitle" placeholder="např. Služby – přeprava" />
        </div>
        <div class="form-group">
            <label>URL zdroje</label>
            <input type="text" id="fUrl" placeholder="https://…" />
        </div>
        <div class="form-group">
            <label>Zdroj (source)</label>
            <select id="fSource">
                <option value="manual">manual</option>
                <option value="web">web</option>
                <option value="facebook">facebook</option>
                <option value="poradna">poradna</option>
            </select>
        </div>
        <div class="form-group">
            <label>Audience</label>
            <select id="fAudience">
                <option value="public_web">public_web</option>
                <option value="poradna_internal">poradna_internal</option>
            </select>
        </div>
        <div class="form-group">
            <label>Datum události (event_date)</label>
            <input type="date" id="fEventDate" />
        </div>
        <div class="form-group">
            <label>Zvýraznit do (highlight_until)</label>
            <input type="date" id="fHighlightUntil" />
        </div>
        <div class="error-msg" id="modalError"></div>
        <div class="modal-footer">
            <button class="btn-ghost" onclick="closeModal('editOverlay')">Zrušit</button>
            <button class="btn-primary" id="saveBtn" onclick="saveChunk()">Uložit</button>
        </div>
    </div>
</div>

<!-- History Modal -->
<div class="overlay" id="historyOverlay">
    <div class="modal">
        <h2>Historie verzí</h2>
        <div id="historyContent"><span class="spinner"></span></div>
        <div class="modal-footer">
            <button class="btn-ghost" onclick="closeModal('historyOverlay')">Zavřít</button>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="overlay" id="deleteOverlay">
    <div class="modal">
        <h2>Smazat záznam?</h2>
        <p style="margin:.75rem 0;color:#555">Před smazáním se uloží záloha do historie (lze obnovit).</p>
        <div class="modal-footer">
            <button class="btn-ghost" onclick="closeModal('deleteOverlay')">Zrušit</button>
            <button class="btn-danger" id="confirmDeleteBtn">Smazat</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentPage = 0;
const PAGE_SIZE = 50;
let editingId = null;

async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    return data;
}

function toast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = isError ? '#e63946' : '#222';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2800);
}

function audienceTag(aud) {
    if (aud === 'public_web') return '<span class="audience-tag tag-public">public</span>';
    if (aud === 'poradna_internal') return '<span class="audience-tag tag-poradna">poradna</span>';
    return `<span class="audience-tag tag-other">${aud || '–'}</span>`;
}

function formatDate(d) {
    if (!d) return '–';
    return new Date(d).toLocaleDateString('cs-CZ');
}

function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadChunks() {
    const search = document.getElementById('searchInput').value.trim();
    const tbody = document.getElementById('chunksTable');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#aaa"><span class="spinner"></span></td></tr>';
    try {
        const { chunks, total } = await api('GET', `/api/admin/chunks?search=${encodeURIComponent(search)}&offset=${currentPage * PAGE_SIZE}&limit=${PAGE_SIZE}`);
        document.getElementById('totalLabel').textContent = `Celkem: ${total} záznamů`;
        if (!chunks.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#aaa">Žádné záznamy</td></tr>';
        } else {
            tbody.innerHTML = chunks.map(c => `
<tr>
  <td class="content-cell">
    <div class="content-preview" onclick="this.classList.toggle('expanded')">${escHtml(c.content)}</div>
    <div class="meta">ID: ${c.id}</div>
  </td>
  <td>
    <div>${escHtml(c.document_title || '–')}</div>
    <div class="meta">${escHtml(c.source || '')}${c.source_url ? ` · <a href="${escHtml(c.source_url)}" target="_blank" style="color:#0077cc">link</a>` : ''}</div>
    ${c.event_date ? `<div class="meta">Událost: ${formatDate(c.event_date)}</div>` : ''}
    ${c.highlight_until ? `<div class="meta">Zvýraznit do: ${formatDate(c.highlight_until)}</div>` : ''}
  </td>
  <td>${audienceTag(c.audience)}</td>
  <td style="white-space:nowrap">${formatDate(c.created_at)}</td>
  <td class="actions">
    <button class="btn-ghost btn-sm" onclick="openEdit(${c.id})">Upravit</button>
    <button class="btn-ghost btn-sm" onclick="openHistory(${c.id})">Historie</button>
    <button class="btn-danger btn-sm" onclick="openDelete(${c.id})">Smazat</button>
  </td>
</tr>`).join('');
        }
        renderPagination(total);
    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#e63946;padding:1rem">${escHtml(e.message)}</td></tr>`;
    }
}

function renderPagination(total) {
    const pages = Math.ceil(total / PAGE_SIZE);
    const el = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    if (currentPage > 0) html += `<button class="btn-ghost btn-sm" onclick="goPage(${currentPage-1})">← Předchozí</button>`;
    html += `<span style="font-size:.85rem;color:#555">Strana ${currentPage+1} / ${pages}</span>`;
    if (currentPage < pages - 1) html += `<button class="btn-ghost btn-sm" onclick="goPage(${currentPage+1})">Další →</button>`;
    el.innerHTML = html;
}

function goPage(p) { currentPage = p; loadChunks(); }

function openCreate() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Nový záznam';
    ['fContent','fTitle','fUrl','fEventDate','fHighlightUntil'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fSource').value = 'manual';
    document.getElementById('fAudience').value = 'public_web';
    document.getElementById('modalError').textContent = '';
    document.getElementById('editOverlay').classList.add('open');
}

async function openEdit(id) {
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Upravit záznam';
    document.getElementById('modalError').textContent = '';
    document.getElementById('editOverlay').classList.add('open');
    try {
        const c = await api('GET', `/api/admin/chunks/${id}`);
        document.getElementById('fContent').value = c.content || '';
        document.getElementById('fTitle').value = c.document_title || '';
        document.getElementById('fUrl').value = c.source_url || '';
        document.getElementById('fSource').value = c.source || 'manual';
        document.getElementById('fAudience').value = c.audience || 'public_web';
        document.getElementById('fEventDate').value = c.event_date ? c.event_date.split('T')[0] : '';
        document.getElementById('fHighlightUntil').value = c.highlight_until ? c.highlight_until.split('T')[0] : '';
    } catch (e) {
        document.getElementById('modalError').textContent = e.message;
    }
}

async function saveChunk() {
    const content = document.getElementById('fContent').value.trim();
    if (!content) { document.getElementById('modalError').textContent = 'Obsah je povinný.'; return; }
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Ukládám…';
    const body = {
        content,
        document_title: document.getElementById('fTitle').value.trim() || null,
        source_url: document.getElementById('fUrl').value.trim() || null,
        source: document.getElementById('fSource').value,
        audience: document.getElementById('fAudience').value,
        event_date: document.getElementById('fEventDate').value || null,
        highlight_until: document.getElementById('fHighlightUntil').value || null,
    };
    try {
        if (editingId) {
            await api('PUT', `/api/admin/chunks/${editingId}`, body);
            toast('Záznam upraven.');
        } else {
            await api('POST', '/api/admin/chunks', body);
            toast('Záznam přidán.');
        }
        closeModal('editOverlay');
        loadChunks();
    } catch (e) {
        document.getElementById('modalError').textContent = e.message;
    } finally {
        btn.disabled = false; btn.textContent = 'Uložit';
    }
}

function openDelete(id) {
    document.getElementById('deleteOverlay').classList.add('open');
    document.getElementById('confirmDeleteBtn').onclick = async () => {
        try {
            await api('DELETE', `/api/admin/chunks/${id}`);
            toast('Záznam smazán.');
            closeModal('deleteOverlay');
            loadChunks();
        } catch (e) { toast(e.message, true); }
    };
}

async function openHistory(id) {
    document.getElementById('historyContent').innerHTML = '<span class="spinner"></span>';
    document.getElementById('historyOverlay').classList.add('open');
    try {
        const rows = await api('GET', `/api/admin/chunks/${id}/history`);
        if (!rows.length) {
            document.getElementById('historyContent').innerHTML = '<p style="color:#aaa">Žádná historie.</p>';
            return;
        }
        const html = rows.map(h => `
<div class="history-item">
  <div class="h-meta">
    <span class="h-action action-${h.action}">${h.action === 'edit' ? 'Úprava' : 'Smazání'}</span>
    <span style="color:#aaa;font-size:.78rem">${new Date(h.created_at).toLocaleString('cs-CZ')}</span>
    <button class="btn-ghost btn-sm" style="margin-left:auto" onclick="restoreVersion(${id}, ${h.id})">Obnovit tuto verzi</button>
  </div>
  <div class="h-content">${escHtml(h.content)}</div>
</div>`).join('');
        document.getElementById('historyContent').innerHTML = `<div class="history-list">${html}</div>`;
    } catch (e) {
        document.getElementById('historyContent').innerHTML = `<p style="color:#e63946">${escHtml(e.message)}</p>`;
    }
}

async function restoreVersion(chunkId, historyId) {
    if (!confirm('Obnovit tuto verzi? Aktuální stav se uloží do historie.')) return;
    try {
        await api('POST', `/api/admin/chunks/${chunkId}/restore/${historyId}`);
        toast('Verze obnovena.');
        closeModal('historyOverlay');
        loadChunks();
    } catch (e) { toast(e.message, true); }
}

function closeModal(id) {
    document.getElementById(id).classList.remove('open');
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { currentPage = 0; loadChunks(); } });
document.querySelectorAll('.overlay').forEach(el => el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); }));

loadChunks();
</script>
</body>
</html>
